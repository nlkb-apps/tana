the file itself is never uploaded.</p>\n    <p><strong>Photos:</strong> resized on your device before upload, which also removes location data and other camera information.</p>\n    <p><strong>Technical data:</strong> your login session is kept in your browser's local storage. Tana has no advertising or analytics trackers. Our hosting providers keep standard server logs, such as IP addresses, for security.</p>\n\n    <h2>What other people can see</h2>\n    <p>Your username, display name, bio, contribution count, comments and database contributions are public, and so are your photos once an editor approves them. Your collection, wantlist and the photos of your copies are public unless you turn that off in Account. <strong>Price paid, the value you set, and date acquired are only ever visible to you.</strong> Game pages show how many members own or want a game as totals, without names for private collections.</p>\n\n    <h2>Why we use it</h2>\n    <p>Only to run Tana: your account and collection, the shared game database, and messages about your account such as sign-up confirmation and password resets. We do not sell your data or use it for advertising.</p>\n\n    <h2>Who processes it for us</h2>\n    <p>Supabase (database, login, photo storage, account emails), with data stored in their Tokyo region. GitHub (serves the app itself). Google Fonts and jsDelivr (deliver the font and code the page loads, so your browser contacts them directly). Some of these companies are based in the United States.</p>\n\n    <h2>Keeping and deleting your data</h2>\n    <p>We keep your data while your account exists. In Account you can <strong>download everything</strong> Tana stores about you and <strong>delete your account</strong>. Deleting removes your profile, collection, wantlist, comments, photos and pending corrections. Games, releases and variants you added to the shared database stay, without your name. To correct or ask about your data in any other way, email ${e}.</p>\n\n    <h2>Age</h2>\n    <p>You need to be at least 13 to create an account. Adult (18+) games are hidden unless you confirm in Account that you are 18 or older.</p>\n\n    <h2>The game catalogue and its licence</h2>\n    <p>Tana's shared game catalogue (games, releases, editions, product codes, readings and regional differences) is published under the <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.en" target="_blank" rel="noopener">Creative Commons Attribution-ShareAlike 4.0</a> licence. Anyone may reuse it if they credit Tana and share it under the same licence. When you add or correct catalogue information, you agree that it is published under this licence. Your collection, wantlist, photos, comments and private prices are not part of the catalogue and are not covered by it.</p>\n    <p>The catalogue is built from these sources, with thanks:</p>\n    <ul>\n      <li><a href="https://github.com/mamedev/mame/tree/master/hash" target="_blank" rel="noopener">MAME software lists</a>, CC0</li>\n      <li><a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a>, CC0</li>\n      <li><a href="http://redump.org" target="_blank" rel="noopener">Redump</a> disc data via the <a href="https://github.com/libretro/libretro-database" target="_blank" rel="noopener">libretro database</a>, CC BY-SA 4.0</li>\n      <li><a href="https://ja.wikipedia.org" target="_blank" rel="noopener">Japanese Wikipedia</a> contributors, CC BY-SA 4.0</li>\n      <li><a href="https://en.wikipedia.org" target="_blank" rel="noopener">English Wikipedia</a> contributors, CC BY-SA 4.0</li>\n      <li>Title readings computed with <a href="https://github.com/taku910/mecab/tree/master/mecab-ipadic" target="_blank" rel="noopener">IPADIC</a>, © Nara Institute of Science and Technology, used under its licence</li>\n      <li>Tana members</li>\n    </ul>\n\n    <h2>The app itself</h2>\n    <p>The catalogue data is open, but Tana's software, design and interface are not. They are © ${(new Date).getFullYear()} ${z(t)}, all rights reserved. You're welcome to use Tana here. You may not copy, modify, redistribute or host the app or its design, in whole or in part, or use them to build another service.</p>\n    <p>Please don't scrape or bulk-download the site or its data connection. If you want the catalogue for your own project, email ${e} and we'll send you an export under its licence.</p>\n\n    <h2 id="photos">Photos</h2>\n    <p>Members supply Tana's photos. Upload only photos you took yourself, of items you own: the box, cartridge or disc, manual, obi, inserts or console. Show the whole item on a real surface.</p>\n    <p>Not allowed: images from shops, auction or flea-market listings, or other people; flatbed scans; screenshots or video captures of games; magazine scans or promotional art; and anything showing people, addresses, shipping labels or receipts.</p>\n    <p>When you upload, you confirm that you took the photo and own the item, and you allow Tana to show it, resized, with your username. You keep the rights to your photo, and you can delete it at any time. An editor checks every photo before anyone else can see it.</p>\n    <p>The artwork, logos and designs shown on game packaging belong to their publishers. Tana shows member photos to identify and document physical copies. If you hold rights in something shown in a photo and want it removed, email ${e} with a link to the page. We remove the photo first and look into it afterwards.</p>\n\n    <h2>Community rules</h2>\n    <ul>\n      <li>No ROMs, disc images, download links, or instructions for getting pirated games.</li>\n      <li>Be respectful. No harassment, hate or personal attacks.</li>\n      <li>Only upload photos you took, of items you own. No screenshots, scans or images from other sites, and no other people's personal information.</li>\n      <li>Keep the database accurate. Say where a correction comes from.</li>\n      <li>No advertising or sales posts for now.</li>\n    </ul>\n    <p>We may remove content or accounts that break these rules.</p>\n\n    <h2>Changes</h2>\n    <p>If this page changes, the date at the top changes too. Significant changes will be announced in the app.</p>\n\n    <hr>\n    <h2 id="ja" lang="ja">日本語（要約）</h2>\n    <div lang="ja">\n    <p><strong>運営者：</strong>${z(a)}（日本）。お問い合わせは ${e} まで。</p>\n    <p><strong>取得する情報：</strong>メールアドレス、ユーザー名、表示名、自己紹介、コレクション（所有ゲーム・付属品・状態・メモ）、購入価格・入手日、ほしいものリスト、写真、コメント、データベースへの投稿・修正提案。パスワードはログイン事業者によりハッシュ化して保存され、運営者が見ることはありません。写真は端末上で縮小され、位置情報などは削除されてからアップロードされます。リストを読み込む場合、ファイルは端末上で読み取られ、照合のためにゲーム名・機種・型番のみが送信されます。ファイル自体はアップロードされません。広告・アクセス解析ツールは使用していません。</p>\n    <p><strong>公開範囲：</strong>ユーザー名・表示名・自己紹介・貢献数・コメント・投稿は公開されます。写真は編集者の承認後に公開されます。コレクション・ほしいものリスト・所有品の写真は、アカウント設定で非公開にできます。<strong>購入価格・評価額・入手日は本人以外には表示されません。</strong></p>\n    <p><strong>利用目的：</strong>Tanaの提供（アカウント、コレクション、共有データベース、アカウント関連のメール送信）のためにのみ利用します。個人情報の販売や広告目的での利用は行いません。</p>\n    <p><strong>委託先：</strong>Supabase（データベース・認証・写真保存・メール送信、東京リージョンに保存）、GitHub（アプリの配信）、Google Fonts・jsDelivr（フォント・プログラムの配信）。一部は米国の事業者です。</p>\n    <p><strong>保存期間と削除：</strong>アカウントが存在する間保存します。アカウント画面から全データのダウンロードとアカウント削除ができます。削除すると、プロフィール・コレクション・ほしいものリスト・コメント・写真・未処理の修正提案が消去されます。共有データベースに追加したゲーム情報は、名前を外した形で残ります。開示・訂正・利用停止などのご請求は ${e} までご連絡ください。</p>\n    <p><strong>年齢：</strong>13歳以上の方がご利用いただけます。成人向け（18禁）タイトルは、アカウント画面で18歳以上であることを確認した場合のみ表示されます。</p>\n    <p><strong>ゲームカタログのライセンス：</strong>ゲーム・発売情報・エディション・型番・読み・海外版との違いなどの共有カタログは、クリエイティブ・コモンズ 表示-継承 4.0（CC BY-SA 4.0）で公開しています。カタログへの追加・修正は同ライセンスで公開されることに同意したものとみなします。コレクション・ほしいものリスト・写真・コメント・購入価格はカタログに含まれません。データ提供元：MAMEソフトウェアリスト（CC0）、Wikidata（CC0）、Redump（libretroデータベース経由、CC BY-SA 4.0）、日本語版・英語版ウィキペディアの執筆者（CC BY-SA 4.0）、Tanaのメンバー。読みの算出にIPADIC（奈良先端科学技術大学院大学、同ライセンスに基づき使用）を使用しています。</p>\n    <p><strong>アプリ本体：</strong>カタログデータは公開ライセンスですが、Tanaのソフトウェア・デザイン・画面構成の著作権は${z(a)}に帰属し、無断での複製・改変・再配布・他サービスへの転用を禁止します。サイトやデータ接続からの自動収集（スクレイピング）はご遠慮ください。カタログデータが必要な場合は ${e} までご連絡いただければ、ライセンスに沿ってデータをお渡しします。</p>\n    <p><strong>写真：</strong>
