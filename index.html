 your login session is kept in your browser's local storage. Tana has no advertising trackers and sets no cookies. To know how many people visit, Tana counts page views on its own database: the page, the site that linked to it, and a code made from your IP address and browser that changes every day and can't be turned back into either. Your IP address itself is not stored. Our hosting providers keep standard server logs, such as IP addresses, for security.</p>\n\n    <h2>What other people can see</h2>\n    <p>Your username, display name, bio, contribution count, comments and database contributions are public, and so are your photos once an editor approves them. Your collection, wantlist and the photos of your copies are public unless you turn that off in Account. <strong>Price paid, the value you set, and date acquired are only ever visible to you.</strong> Game pages show how many members own or want a game as totals, without names for private collections.</p>\n\n    <h2>Why we use it</h2>\n    <p>Only to run Tana: your account and collection, the shared game database, and messages about your account such as sign-up confirmation and password resets. If you say yes to the weekly letter, we email it to you each week, with a few lines made from your own shelf; every letter has a one-click link to stop it, and you can change it in Account. We do not sell your data or use it for advertising.</p>\n\n    <h2>Who processes it for us</h2>\n    <p>Supabase (database, login, photo storage, account emails), with data stored in their Tokyo region. Resend (delivers the weekly letter, only to members who asked for it). GitHub (serves the app itself). Google Fonts and jsDelivr (deliver the font and code the page loads, so your browser contacts them directly). Some of these companies are based in the United States.</p>\n\n    <h2>Keeping and deleting your data</h2>\n    <p>We keep your data while your account exists. In Account you can <strong>download everything</strong> Tana stores about you and <strong>delete your account</strong>. Deleting removes your profile, collection, wantlist, comments, photos and pending corrections. Games, releases and variants you added to the shared database stay, without your name. To correct or ask about your data in any other way, email ${e}.</p>\n\n    <h2>Age</h2>\n    <p>You need to be at least 13 to create an account. Adult (18+) games are hidden unless you confirm in Account that you are 18 or older.</p>\n\n    <h2>The game catalogue and its licence</h2>\n    <p>Tana's shared game catalogue (games, releases, editions, product codes, readings and regional differences) is published under the <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.en" target="_blank" rel="noopener">Creative Commons Attribution-ShareAlike 4.0</a> licence. Anyone may reuse it if they credit Tana and share it under the same licence. When you add or correct catalogue information, you agree that it is published under this licence. Your collection, wantlist, photos, comments and private prices are not part of the catalogue and are not covered by it.</p>\n    <p>The catalogue is built from these sources, with thanks:</p>\n    <ul>\n      <li><a href="https://github.com/mamedev/mame/tree/master/hash" target="_blank" rel="noopener">MAME software lists</a>, CC0</li>\n      <li><a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a>, CC0</li>\n      <li><a href="http://redump.org" target="_blank" rel="noopener">Redump</a> disc data via the <a href="https://github.com/libretro/libretro-database" target="_blank" rel="noopener">libretro database</a>, CC BY-SA 4.0</li>\n      <li><a href="https://ja.wikipedia.org" target="_blank" rel="noopener">Japanese Wikipedia</a> contributors, CC BY-SA 4.0</li>\n      <li><a href="https://en.wikipedia.org" target="_blank" rel="noopener">English Wikipedia</a> contributors, CC BY-SA 4.0</li>\n      <li>Title readings computed with <a href="https://github.com/taku910/mecab/tree/master/mecab-ipadic" target="_blank" rel="noopener">IPADIC</a>, © Nara Institute of Science and Technology, used under its licence</li>\n      <li>Tana members</li>\n    </ul>\n\n    <h2 id="boxart">Box art</h2>\n    <p>The box art next to games helps you recognise a release at a glance. It comes from the <a href="https://github.com/libretro-thumbnails" target="_blank" rel="noopener">libretro-thumbnails</a> collection, from <a href="https://www.gametdb.com" target="_blank" rel="noopener">GameTDB</a>, from the infobox images on <a href="https://en.wikipedia.org" target="_blank" rel="noopener">English Wikipedia</a> (found with the help of <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a>), and from members' own approved photos of the front of their copies. Images are resized on the fly by <a href="https://wsrv.nl" target="_blank" rel="noopener">wsrv.nl</a>. Box art is not part of the catalogue and is not covered by its licence. The artwork belongs to its publishers and is shown to identify the product.</p>\n    <p>The small JP, NA or EU patch on each box is the region of the release you're looking at. When a release has no art of its own yet, Tana may show the box from another region of the same game, still with the patch of the release you're looking at.</p>\n    <p>If you hold rights in box art shown here and want it removed, email ${e} with a link to the page and we'll take it down. Members can report wrong box art from the game page.</p>\n\n    <h2>The app itself</h2>\n    <p>The catalogue data is open, but Tana's software, design and interface are not. They are © ${(new Date).getFullYear()} ${K(t)}, all rights reserved. You're welcome to use Tana here. You may not copy, modify, redistribute or host the app or its design, in whole or in part, or use them to build another service.</p>\n    <p>Please don't scrape or bulk-download the site or its data connection. If you want the catalogue for your own project, email ${e} and we'll send you an export under its licence.</p>\n\n    <h2 id="photos">Photos</h2>\n    <p>Members supply Tana's photos. Upload only photos you took yourself, of items you own: the box, cartridge or disc, manual, obi, inserts or console. Show the whole item on a real surface.</p>\n    <p>Not allowed: images from shops, auction or flea-market listings, or other people; flatbed scans; screenshots or video captures of games; magazine scans or promotional art; and anything showing people, addresses, shipping labels or receipts.</p>\n    <p>When you upload, you confirm that you took the photo and own the item, and you allow Tana to show it, resized, with your username. You keep the rights to your photo, and you can delete it at any time. An editor checks every photo before anyone else can see it.</p>\n    <p>The artwork, logos and designs shown on game packaging belong to their publishers. Tana shows member photos to identify and document physical copies. If you hold rights in something shown in a photo and want it removed, email ${e} with a link to the page. We remove the photo first and look into it afterwards.</p>\n\n    <h2>Community rules</h2>\n    <ul>\n      <li>No ROMs, disc images, download links, or instructions for getting pirated games.</li>\n      <li>Be respectful. No harassment, hate or personal attacks.</li>\n      <li>Only upload photos you took, of items you own. No screenshots, scans or images from other sites, and no other people's personal information.</li>\n      <li>Keep the database accurate. Say where a correction comes from.</li>\n      <li>No advertising or sales posts for now.</li>\n    </ul>\n    <p>We may remove content or accounts that break these rules.</p>\n\n    <h2>Changes</h2>\n    <p>If this page changes, the date at the top changes too. Significant changes will be announced in the app.</p>\n\n    <hr>\n    <h2 id="ja" lang="ja">日本語（要約）</h2>\n    <div lang="ja">\n    <p><strong>運営者：</strong>${K(a)}（日本）。お問い合わせは ${e} まで。</p>\n    <p><strong>取得する情報
